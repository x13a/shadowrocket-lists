name: Update Shadowrocket Lists

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v7

      - name: Download v2fly data
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git v2fly-data

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Clean old output
        run: rm -rf shadowrocket

      - name: Run generator
        run: go run main.go

      - name: Commit and push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add shadowrocket/ 
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update rulesets: $(date +'%Y-%m-%d')" && git push)
